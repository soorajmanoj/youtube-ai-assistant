<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube AI Assistant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161923;
    --border: #262b3a;
    --text: #e6e8ee;
    --muted: #8b90a3;
    --accent: #6c8cff;
    --accent-hover: #86a1ff;
    --user-bubble: #26314f;
    --bot-bubble: #1d212d;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: #0d0f15;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: #0d0f15;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  button:disabled {
    background: #3a3f52;
    color: var(--muted);
    cursor: not-allowed;
  }
  #status {
    font-size: 13px;
    margin-top: 8px;
    color: var(--muted);
    min-height: 16px;
  }
  #status.error { color: var(--error); }
  #status.success { color: #6cff9c; }

  #chat-panel { display: none; flex-direction: column; gap: 12px; }
  #messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 420px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 85%;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
  }
  .msg.pending {
    color: var(--muted);
    font-style: italic;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>YouTube AI Assistant</h1>
      <p>Paste a YouTube link, then ask questions about the video. Runs locally via Ollama.</p>
    </header>

    <div class="panel">
      <div class="row">
        <input type="text" id="video-url" placeholder="https://www.youtube.com/watch?v=..." />
        <button id="process-btn">Process Video</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="panel" id="chat-panel">
      <div id="messages"></div>
      <div class="row">
        <input type="text" id="question-input" placeholder="Ask a question about the video..." disabled />
        <button id="ask-btn" disabled>Ask</button>
      </div>
    </div>

    <footer>FastAPI + LangChain + Ollama</footer>
  </div>

<script>
  const API_BASE = "";
  let sessionId = null;

  const urlInput = document.getElementById("video-url");
  const processBtn = document.getElementById("process-btn");
  const statusEl = document.getElementById("status");
  const chatPanel = document.getElementById("chat-panel");
  const messagesEl = document.getElementById("messages");
  const questionInput = document.getElementById("question-input");
  const askBtn = document.getElementById("ask-btn");

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function processVideo() {
    const url = urlInput.value.trim();
    if (!url) {
      setStatus("Enter a YouTube URL first.", "error");
      return;
    }

    processBtn.disabled = true;
    setStatus("Fetching transcript and building index... this can take a minute.", "");

    try {
      const res = await fetch(`${API_BASE}/process`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || "Failed to process video.");
      }

      sessionId = data.session_id;
      setStatus("Video processed. Ask away.", "success");
      chatPanel.style.display = "flex";
      messagesEl.innerHTML = "";
      questionInput.disabled = false;
      askBtn.disabled = false;
      questionInput.focus();
    } catch (err) {
      setStatus(err.message, "error");
    } finally {
      processBtn.disabled = false;
    }
  }

  async function askQuestion() {
    const question = questionInput.value.trim();
    if (!question || !sessionId) return;

    addMessage(question, "user");
    questionInput.value = "";
    askBtn.disabled = true;
    questionInput.disabled = true;

    const pending = addMessage("Thinking...", "bot pending");

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, question }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || "Failed to get an answer.");
      }

      pending.textContent = data.answer;
      pending.classList.remove("pending");
    } catch (err) {
      pending.textContent = "Error: " + err.message;
      pending.classList.remove("pending");
    } finally {
      askBtn.disabled = false;
      questionInput.disabled = false;
      questionInput.focus();
    }
  }

  processBtn.addEventListener("click", processVideo);
  urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") processVideo(); });
  askBtn.addEventListener("click", askQuestion);
  questionInput.addEventListener("keydown", (e) => { if (e.key === "Enter") askQuestion(); });
</script>
</body>
</html>
